services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: palmiiz-bf6-stats-dev
    ports:
      - "3022:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped